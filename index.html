    if (waterSurfaceY > -160) {
      ctx.fillStyle = theme.floor;
      ctx.beginPath(); ctx.moveTo(0, waterSurfaceY + 120); ctx.lineTo(0, waterSurfaceY - 22);
      ctx.lineTo(155, waterSurfaceY - 22); ctx.lineTo(182, waterSurfaceY + 45); ctx.closePath(); ctx.fill();

      ctx.fillStyle = theme.pier;
      ctx.fillRect(10, waterSurfaceY - 30, 155, 9);

      // GÃ¼zelbahÃ§e Deniz Feneri
      if (state.spotIdx === 1) {
        ctx.fillStyle = '#f8fafc'; ctx.fillRect(142, waterSurfaceY - 76, 14, 46);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(142, waterSurfaceY - 64, 14, 12); ctx.fillRect(142, waterSurfaceY - 82, 14, 8);
      }

      // KÄ±yÄ±daki IÅŸÄ±nlanma TaÅŸÄ± (TÄ±klayÄ±nca HaritayÄ± AÃ§ar)
      ctx.save();
      ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.moveTo(38, waterSurfaceY - 78); ctx.lineTo(50, waterSurfaceY - 54); ctx.lineTo(38, waterSurfaceY - 32); ctx.lineTo(26, waterSurfaceY - 54); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#fde047'; ctx.font = 'bold 9px sans-serif';
      ctx.fillText('ğŸ”® HARÄ°TA', 16, waterSurfaceY - 84);

      tipPos = drawArticulatedAngler(ctx, 108, waterSurfaceY - 30, 1.25, time);
    }

    // 5. SAHTE YEM VE MÄ°SÄ°NA
    const lureScreenX = 205 + (state.lure.dist / 120) * (w - 255);
    const lureScreenY = state.phase === 'flying'
      ? waterSurfaceY - Math.sin(state.lure.flyProgress * Math.PI) * 115
      : waterSurfaceY + state.lure.depth * pxPerMeter;

    if (state.phase !== 'idle' && state.phase !== 'charging') {
      ctx.strokeStyle = state.tension > 75 ? '#ef4444' : 'rgba(226,232,240,0.75)';
      ctx.lineWidth = state.tension > 75 ? 1.8 : 1.2;
      ctx.beginPath(); ctx.moveTo(tipPos.tipWorldX, tipPos.tipWorldY); ctx.lineTo(lureScreenX, lureScreenY); ctx.stroke();

      const activeLure = state.lures[state.activeSlot];
      const lureGlow = getGlowColor(activeLure.plus, time);
      ctx.save(); ctx.translate(lureScreenX, lureScreenY);
      if (lureGlow) { ctx.shadowColor = lureGlow; ctx.shadowBlur = 14; }
      ctx.fillStyle = lureGlow || '#38bdf8';
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 4.5, Math.sin(time * 10) * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 6. KÄ°LO VE BOYUTA TAM ORANTILI BALIK Ã‡Ä°ZÄ°MÄ°
    state.fishes.forEach(f => {
      if (!f.cm) f.cm = calcFishCm(f);
      const fx = 205 + (f.distM / 120) * (w - 255);
      const fy = waterSurfaceY + f.depth * pxPerMeter;
      if (fy < -80 || fy > h + 80) return;

      const distToLurePx = Math.hypot(fx - lureScreenX, fy - lureScreenY);
      let visibilityAlpha = 0.34;
      if (state.phase !== 'idle' && distToLurePx < 240) {
        visibilityAlpha = Math.min(1, 0.4 + (1 - distToLurePx / 240) * 0.8);
      }
      if (f.state === 'chase' || f.state === 'hooked') visibilityAlpha = 1.0;

      const size = getProportionalFishSize(f);
      ctx.save();
      ctx.globalAlpha = visibilityAlpha;
      ctx.translate(fx, fy);
      ctx.scale(f.facing, 1);
      ctx.rotate(Math.sin(f.tailPhase) * 0.055);

      const wag = Math.sin(f.tailPhase) * (size * 0.16);
      ctx.fillStyle = f.sp.col1;
      ctx.beginPath();
      ctx.moveTo(-size * 0.82, 0);
      ctx.lineTo(-size * 1.38, -size * 0.44 + wag);
      ctx.lineTo(-size * 1.15, wag * 0.4);
      ctx.lineTo(-size * 1.38, size * 0.44 + wag);
      ctx.closePath(); ctx.fill();

      const grad = ctx.createLinearGradient(0, -size * 0.45, 0, size * 0.45);
      grad.addColorStop(0, f.sp.col1); grad.addColorStop(1, f.sp.col2);
      ctx.fillStyle = grad;
      const ry = f.sp.body === 'needle' ? size * 0.17 : (f.sp.body === 'sword' ? size * 0.24 : (f.sp.body === 'oval' ? size * 0.46 : size * 0.32));
      ctx.beginPath(); ctx.ellipse(0, 0, size, ry, 0, 0, Math.PI * 2); ctx.fill();

      // KÄ±lÄ±Ã§ BalÄ±ÄŸÄ± GagasÄ± veya Fener BalÄ±ÄŸÄ± Anteni
      if (f.sp.body === 'sword') {
        ctx.strokeStyle = f.sp.col1; ctx.lineWidth = Math.max(2, size * 0.06);
        ctx.beginPath(); ctx.moveTo(size * 0.9, 0); ctx.lineTo(size * 1.55, 0); ctx.stroke();
      } else if (f.sp.body === 'angler') {
        ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(size * 0.4, -ry * 0.8); ctx.quadraticCurveTo(size * 0.9, -ry * 1.5, size * 1.1, -ry * 0.5); ctx.stroke();
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(size * 1.1, -ry * 0.5, 4, 0, Math.PI * 2); ctx.fill();
      }

      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(size * 0.58, -ry * 0.22, Math.max(2, size * 0.09), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(size * 0.61, -ry * 0.22, Math.max(1.1, size * 0.045), 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      if (f.state === 'chase' || f.state === 'hooked') {
        ctx.fillStyle = f.state === 'hooked' ? '#fbbf24' : '#38bdf8';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(`${f.sp.name} (${f.kg} kg â€¢ ${f.cm} cm)`, fx - 45, fy - ry - 8);
      }
    });

    ctx.restore();
  };

  syncModeUI();
})();
</script>
